apiVersion: v1
kind: ConfigMap
metadata:
  name: fintrack-config
data:
  SUPABASE_URL: "https://xxxxxxxx.supabase.co"
  FINTRACK_COOKIE_SECURE: "1"
  FINTRACK_LOG_LEVEL: "INFO"
  FINANCE_API_URL: "http://finance-api:8000"
  AI_SERVICE_URL: "http://ai-service:8000"
  NOTIFIER_URL: "http://notifier:8000"
  CLAUDE_MODEL: "claude-opus-5-5"
  GEMINI_MODEL: "gemini-2.5-flash"
  AI_DAILY_LIMIT: "40"
  NOTIFIER_DB_PATH: "/data/notifier.db"
  NOTIFIER_ALLOWED_HOSTS: "ntfy.sh,discord.com,discordapp.com,hooks.slack.com"
  TICKTICK_CLIENT_ID: ""
  TICKTICK_REDIRECT_URI: "https://fintrack.example.com/parametres/ticktick/callback"
  # Plage d'adresses du contrôleur d'Ingress autorisée à fournir X-Forwarded-For
  FORWARDED_ALLOW_IPS: "10.0.0.0/8"
