apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fintrack
labels:
  - pairs: { app.kubernetes.io/part-of: fintrack }
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - networkpolicies.yaml
  - redis.yaml
  - web.yaml
  - finance-api.yaml
  - ai-service.yaml
  - notifier.yaml
# Le Secret « fintrack-secrets » est fourni par l'overlay (secretGenerator,
# Sealed Secrets ou External Secrets Operator) — jamais dans la base.
