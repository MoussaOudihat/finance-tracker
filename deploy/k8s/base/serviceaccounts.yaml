# Une identité par service, sans jeton d'API Kubernetes monté
# (aucun service n'a besoin de parler à l'API du cluster).
apiVersion: v1
kind: ServiceAccount
metadata: { name: web }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: finance-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ai-service }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: notifier }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: redis }
automountServiceAccountToken: false
