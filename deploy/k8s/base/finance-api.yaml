# Généré à partir d'un modèle commun — sécurité et sondes identiques pour tous les services.
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "finance-api"
  labels:
    app.kubernetes.io/name: "finance-api"
    app.kubernetes.io/part-of: "fintrack"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: "finance-api"
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "finance-api"
        app.kubernetes.io/part-of: "fintrack"
    spec:
      serviceAccountName: "finance-api"
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: "finance-api"
      containers:
        - name: "finance-api"
          image: "ghcr.io/moussaoudihat/fintrack-finance-api:2.0.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: "http"
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: "fintrack-config"
          env:
            - name: "SUPABASE_ANON_KEY"
              valueFrom:
                secretKeyRef:
                  name: "fintrack-secrets"
                  key: "SUPABASE_ANON_KEY"
            - name: "NOTIFIER_INTERNAL_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "fintrack-secrets"
                  key: "NOTIFIER_INTERNAL_TOKEN"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
      volumes:
        - name: "tmp"
          emptyDir:
            sizeLimit: "32Mi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "finance-api"
  labels:
    app.kubernetes.io/name: "finance-api"
    app.kubernetes.io/part-of: "fintrack"
spec:
  selector:
    app.kubernetes.io/name: "finance-api"
  ports:
    - name: "http"
      port: 8000
      targetPort: "http"
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "finance-api"
spec:
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "finance-api"
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: "Resource"
      resource:
        name: "cpu"
        target:
          type: "Utilization"
          averageUtilization: 70
---
apiVersion: "policy/v1"
kind: "PodDisruptionBudget"
metadata:
  name: "finance-api"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "finance-api"
