# Généré à partir d'un modèle commun — sécurité et sondes identiques pour tous les services.
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "notifier"
  labels:
    app.kubernetes.io/name: "notifier"
    app.kubernetes.io/part-of: "fintrack"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: "notifier"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "notifier"
        app.kubernetes.io/part-of: "fintrack"
    spec:
      serviceAccountName: "notifier"
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - name: "notifier"
          image: "ghcr.io/moussaoudihat/fintrack-notifier:2.0.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: "http"
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: "fintrack-config"
          env:
            - name: "NOTIFIER_INTERNAL_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "fintrack-secrets"
                  key: "NOTIFIER_INTERNAL_TOKEN"
            - name: "NOTIFIER_ENCRYPTION_KEY"
              valueFrom:
                secretKeyRef:
                  name: "fintrack-secrets"
                  key: "NOTIFIER_ENCRYPTION_KEY"
            - name: "TICKTICK_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: "fintrack-secrets"
                  key: "TICKTICK_CLIENT_SECRET"
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "25m"
              memory: "96Mi"
            limits:
              memory: "192Mi"
          startupProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
            - name: "data"
              mountPath: "/data"
      volumes:
        - name: "tmp"
          emptyDir:
            sizeLimit: "32Mi"
        - name: "data"
          persistentVolumeClaim:
            claimName: "notifier-data"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "notifier"
  labels:
    app.kubernetes.io/name: "notifier"
    app.kubernetes.io/part-of: "fintrack"
spec:
  selector:
    app.kubernetes.io/name: "notifier"
  ports:
    - name: "http"
      port: 8000
      targetPort: "http"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "notifier-data"
  labels:
    app.kubernetes.io/name: "notifier"
    app.kubernetes.io/part-of: "fintrack"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "256Mi"
