# Redis : sessions web et compteurs (quotas IA, tentatives de connexion).
# Données éphémères par conception (pas de persistance) : un redémarrage
# déconnecte simplement les utilisateurs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fintrack }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fintrack }
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine@sha256:1cf73a2f04808e55a8bd2f5706c2aa0ebb0f71938f93deb7af79f48311cd5cb9
          command: ["sh", "-c"]
          args:
            - >-
              exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
              --maxmemory 64mb --maxmemory-policy allkeys-lru
              --rename-command FLUSHALL "" --rename-command CONFIG "" --rename-command DEBUG ""
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: fintrack-secrets, key: REDIS_PASSWORD } }
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: fintrack-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fintrack }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
