apiVersion: v1
kind: ConfigMap
metadata:
  name: fintrack-web-config
data:
  FINTRACK_AUTH_MODE: "supabase"
  FINTRACK_DATA_DIR: "/data"
  FINTRACK_COOKIE_SECURE: "1"
  FINTRACK_SESSION_MAX_AGE: "28800"
  FINTRACK_SYNC_DELAY: "20"
  FINTRACK_IDLE_TIMEOUT: "3600"
  # Pas secret (clé publique côté client), mais propre à votre projet :
  SUPABASE_URL: "https://xxxxxxxx.supabase.co"
