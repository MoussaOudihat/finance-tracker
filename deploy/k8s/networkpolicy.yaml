# Entrant : uniquement depuis le contrôleur d'Ingress.
# Sortant : DNS + HTTPS (Supabase). Nécessite un CNI qui applique les
# NetworkPolicy (Calico, Cilium…) — sans effet sinon.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fintrack-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fintrack-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
