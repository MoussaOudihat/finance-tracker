# kubectl apply -k deploy/k8s
# (créer d'abord le secret fintrack-web-secret — voir secret.example.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fintrack
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: ghcr.io/moussaoudihat/fintrack-web
    newTag: "2.0.0"
