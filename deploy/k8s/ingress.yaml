# Exposition HTTPS. Adapter l'hôte, la classe d'Ingress et l'émetteur de
# certificat (ici cert-manager + ingress-nginx, les plus courants).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintrack-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [fintrack.example.com]
      secretName: fintrack-web-tls
  rules:
    - host: fintrack.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fintrack-web
                port:
                  name: http
