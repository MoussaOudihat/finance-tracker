{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fintrack.labelsAll" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if and .Values.mcp.enabled (eq (include "fintrack.mcpViaIngress" .) "true") }}
          # Serveur MCP + métadonnées OAuth RFC 9728 (découverte par les clients)
          # Prefix : « /mcp/ » (barre finale) atteint aussi le serveur MCP
          - path: {{ include "fintrack.mcpPath" . }}
            pathType: Prefix
            backend:
              service: { name: mcp, port: { name: http } }
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service: { name: mcp, port: { name: http } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
{{- end }}
