{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
# Zéro confiance : tout est interdit, puis chaque flux est autorisé
# explicitement. Nécessite un CNI qui applique les NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ $inst }} }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ $inst }} }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Sortie Internet en HTTPS uniquement, sans plages privées ni métadonnées
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-allow-internet-https
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
      - { key: app.kubernetes.io/name, operator: In, values: [web, finance-api, ai-service, notifier, mcp] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.networkPolicy.egressExceptCidrs }}
      ports: [{ port: 443, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-web
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: fintrack-test } }
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: ai-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: notifier } }
      ports: [{ port: 8000 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: redis } }
      ports: [{ port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-finance-api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: ai-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: fintrack-test } }
        {{- if .Values.mcp.enabled }}
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: mcp } }
        {{- end }}
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: notifier } }
      ports: [{ port: 8000 }]
---
{{- if .Values.mcp.enabled }}
# Serveur MCP : exposé par l'Ingress, ne parle qu'à finance-api (+ JWKS
# Supabase via la règle de sortie HTTPS commune).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-mcp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: mcp } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: fintrack-test } }
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
      ports: [{ port: 8000 }]
---
{{- end }}
# Pod de `helm test` : sortie vers web et finance-api uniquement (son
# identité propre le garde hors du Service web et du PDB).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-fintrack-test
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: fintrack-test } }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-ai-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: ai-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
      ports: [{ port: 8000 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: redis } }
      ports: [{ port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-notifier
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: notifier } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: finance-api } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inst }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: web } }
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/name: ai-service } }
      ports: [{ port: 6379 }]
{{- end }}
