# Configuration des outils qualité / sécurité (pas de packaging ici).

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/F : erreurs ; B : bugbear ; S : règles de sécurité (bandit) ; UP : modernisation
select = ["E", "F", "B", "S", "UP"]
ignore = [
  "E501",   # longueur de ligne : gérée au cas par cas
  "B008",   # Depends()/Form() en valeur par défaut : idiome FastAPI
  "S101",   # assert (tests)
  "UP007", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "E731"]
"desktop/tests/**" = ["S", "B"]
# Code desktop historique : non concerné par le lint strict des services
"desktop/**" = ["S", "B", "UP", "E"]

[tool.bandit]
exclude_dirs = [".venv", "services/tests", "desktop"]
skips = ["B101"]

[tool.pytest.ini_options]
addopts = "-q"
