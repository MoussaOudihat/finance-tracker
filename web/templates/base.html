<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Fintrack{% endblock %} · Fintrack</title>
  <link rel="icon" type="image/png" href="/static/fintrack.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user_email is defined and active %}
<header class="topbar">
  <a class="brand" href="/"><img src="/static/fintrack.png" alt="" width="28" height="28"> Fintrack</a>
  <nav class="nav" aria-label="Navigation principale">
    <a href="/" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Tableau de bord</a>
    <a href="/depenses" {% if active == 'depenses' %}aria-current="page"{% endif %}>Dépenses</a>
    <a href="/revenus" {% if active == 'revenus' %}aria-current="page"{% endif %}>Revenus</a>
    <a href="/epargne" {% if active == 'epargne' %}aria-current="page"{% endif %}>Épargne</a>
    <a href="/patrimoine" {% if active == 'patrimoine' %}aria-current="page"{% endif %}>Patrimoine</a>
  </nav>
  <form method="post" action="/deconnexion" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted user">{{ user_email }}</span>
    <button type="submit" class="btn btn-ghost">Déconnexion</button>
  </form>
</header>
{% endif %}
<main class="container">
  {% if flash %}
  <div class="flash flash-{{ flash.kind }}" role="status">{{ flash.message }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="footer muted">Fintrack v{{ APP_VERSION }}</footer>
</body>
</html>
