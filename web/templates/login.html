{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="card login">
  <img src="/static/fintrack.png" alt="" width="64" height="64">
  <h1>Fintrack</h1>
  <p class="muted">
    {% if auth_mode == 'supabase' %}Connectez-vous avec le compte utilisé dans l'application desktop.
    {% else %}Connexion à votre espace.{% endif %}
  </p>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/connexion" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{% if auth_mode == 'supabase' %}Email{% else %}Identifiant{% endif %}
      <input name="identifier" value="{{ identifier or '' }}" required autofocus
             {% if auth_mode == 'supabase' %}type="email" autocomplete="email"{% else %}autocomplete="username"{% endif %}>
    </label>
    <label>Mot de passe
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Se connecter</button>
  </form>
</section>
{% endblock %}
