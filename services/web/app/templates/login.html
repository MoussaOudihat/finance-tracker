{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="card login">
  <img src="{{ static("fintrack.png") }}" alt="" width="64" height="64">
  <h1>Fintrack</h1>
  <p class="muted">Connectez-vous avec le compte utilisé dans l'application desktop.</p>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/connexion" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>Email
      <input name="identifier" type="email" autocomplete="email" value="{{ identifier or '' }}" required autofocus>
    </label>
    <label>Mot de passe
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Se connecter</button>
  </form>
</section>
{% endblock %}
