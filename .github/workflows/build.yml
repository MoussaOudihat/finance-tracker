name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller "Finance Tracker.spec"

      - name: Verify build
        run: |
          if (Test-Path "dist\Fintrack\Fintrack.exe") {
            Write-Host "✅ Build OK — dist\Fintrack\Fintrack.exe"
          } else {
            Write-Host "❌ Build FAILED — exe non trouvé"
            exit 1
          }
        shell: pwsh

      - name: Package ZIP
        run: |
          $version = Get-Content VERSION -Raw
          $version = $version.Trim()
          Compress-Archive -Path "dist\Fintrack\*" -DestinationPath "Fintrack-v$version-windows.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fintrack-windows
          path: Fintrack-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fintrack-*.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
