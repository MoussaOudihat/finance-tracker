name: CI

# Déclenché sur chaque push/PR vers develop et main
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ──────────────────────────────────────────────────────────
  #  Vérification syntaxe & imports
  # ──────────────────────────────────────────────────────────
  syntax-check:
    name: Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax (all .py files)
        run: |
          echo "Vérification syntaxe..."
          python -m compileall -q . -x "__pycache__|venv|env|build|dist"
          echo "✅ Syntaxe OK"

      - name: Check core module imports
        run: |
          echo "Vérification des imports principaux..."
          python -c "
          import config
          import database
          import auth
          import ui.components
          print('✅ Imports principaux OK')
          "

      - name: Check all page imports
        run: |
          python -c "
          pages = [
              'ui.pages.dashboard', 'ui.pages.revenues', 'ui.pages.expenses',
              'ui.pages.savings_entry', 'ui.pages.analyses', 'ui.pages.budget',
              'ui.pages.objectifs', 'ui.pages.patrimoine', 'ui.pages.historique',
              'ui.pages.settings', 'ui.pages.recommandations', 'ui.pages.projection',
          ]
          for p in pages:
              __import__(p)
          print(f'✅ {len(pages)} pages importées avec succès')
          "

  # ──────────────────────────────────────────────────────────
  #  Tests (couche données + interface web)
  # ──────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pytest
      - name: Run tests
        run: python -m pytest -q

  # ──────────────────────────────────────────────────────────
  #  Image Docker + manifestes Kubernetes
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker image & K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=ci -t fintrack-web:ci .
      - name: Smoke test (/healthz)
        # Hash bcrypt factice : seul le démarrage (validation de la config) est testé.
        run: |
          docker run -d --name fw -p 8000:8000 \
            -e FINTRACK_SECRET_KEY="$(openssl rand -hex 32)" \
            -e FINTRACK_AUTH_MODE=local -e FINTRACK_WEB_USER=ci \
            -e FINTRACK_WEB_PASSWORD_HASH='$2b$12$C6UzMDM.H6dfI/f/IKcEeO5b6hFqZ3kZ1lZ7w3o6bq3O0D1Jx6M5e' \
            --read-only --tmpfs /tmp fintrack-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs fw; exit 1
      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /dev/null

  # ──────────────────────────────────────────────────────────
  #  Vérification build PyInstaller (dry-run, sans upx)
  # ──────────────────────────────────────────────────────────
  build-check:
    name: Build Check (Windows)
    runs-on: windows-latest
    # Seulement sur les PR vers main (pour ne pas ralentir chaque push develop)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller reportlab

      - name: Build executable
        run: pyinstaller "Finance Tracker.spec"

      - name: Verify output
        run: |
          if (Test-Path "dist\Fintrack\Fintrack.exe") {
            Write-Host "✅ Build OK — Fintrack.exe généré"
          } else {
            Write-Host "❌ Build FAILED — exe non trouvé"
            exit 1
          }
