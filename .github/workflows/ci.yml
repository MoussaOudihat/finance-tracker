name: CI

# Pipeline DevSecOps : qualité, tests, SAST, dépendances, secrets, images,
# configuration IaC. Chaque job a des permissions minimales ; toutes les
# actions sont épinglées par SHA (Dependabot les tient à jour).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────
  #  Qualité + tests (desktop et microservices)
  # ──────────────────────────────────────────────────────────
  lint-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/**/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements-dev.txt
      - name: Ruff (lint + règles sécurité S)
        run: ruff check services desktop/tests --output-format github
      - name: Syntaxe de tout le dépôt
        run: python -m compileall -q . -x "(\.venv|build|dist)"
      - name: Tests microservices
        working-directory: services
        run: python -m pytest -q tests

  # Environnement séparé : l'app desktop a ses propres épingles (httpx<0.28)
  desktop-test:
    name: Tests desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest==9.2.0
      - name: Tests (couche données + synchro)
        working-directory: desktop
        run: python -m pytest -q tests

  # ──────────────────────────────────────────────────────────
  #  SAST
  # ──────────────────────────────────────────────────────────
  bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install "bandit[sarif,toml]==1.9.4"
      - name: Bandit (services)
        run: bandit -r services -c pyproject.toml -x services/tests -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with: { sarif_file: bandit.sarif, category: bandit }
      - name: Échec sur sévérité moyenne ou plus
        run: bandit -r services -c pyproject.toml -x services/tests -ll

  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, security-events: write }
    container: { image: semgrep/semgrep:1.140.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Semgrep (Python, OWASP, secrets, Dockerfile, Kubernetes)
        run: >
          semgrep scan --metrics=off --error
          --config p/python --config p/owasp-top-ten --config p/secrets
          --config p/dockerfile --config p/kubernetes
          --exclude tests --exclude services/tests
          --sarif --sarif-output=semgrep.sarif services deploy
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  # ──────────────────────────────────────────────────────────
  #  Dépendances (SCA) et secrets
  # ──────────────────────────────────────────────────────────
  pip-audit:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        req: [services/web, services/finance_api, services/ai_service, services/notifier]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install pip-audit==2.10.1
      - working-directory: ${{ matrix.req }}
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  gitleaks:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ──────────────────────────────────────────────────────────
  #  Images : lint Dockerfile, build, scan vulnérabilités, test de fumée
  # ──────────────────────────────────────────────────────────
  hadolint:
    name: Dockerfile — Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: services/Dockerfile, failure-threshold: warning }

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-test, desktop-test, hadolint]
    permissions: { contents: read, security-events: write }
    strategy:
      fail-fast: false
      matrix:
        service: [web, finance_api, ai_service, notifier]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services
          file: services/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=ci-${{ github.sha }}
          tags: fintrack-${{ matrix.service }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy — vulnérabilités de l'image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fintrack-${{ matrix.service }}:ci
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        if: always()
        with: { sarif_file: "trivy-${{ matrix.service }}.sarif", category: "trivy-${{ matrix.service }}" }
      - name: Trivy — échec sur CRITICAL/HIGH corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fintrack-${{ matrix.service }}:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
      - name: Test de fumée (démarrage + non-root + rootfs RO)
        env: { SERVICE: "${{ matrix.service }}" }
        run: |
          set -euo pipefail
          key=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run -d --name svc --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v svcdata:/data \
            -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=x \
            -e FINANCE_API_URL=http://127.0.0.1:1 -e SESSION_ENCRYPTION_KEY="$key" \
            -e NOTIFIER_INTERNAL_TOKEN="$(openssl rand -hex 24)" -e NOTIFIER_ENCRYPTION_KEY="$key" \
            "fintrack-${SERVICE}:ci"
          for _ in $(seq 1 30); do
            if docker exec svc python -m fintrack_common.healthcheck /healthz; then
              test "$(docker exec svc id -u)" = "10001"; exit 0
            fi
            sleep 1
          done
          docker logs svc; exit 1

  # ──────────────────────────────────────────────────────────
  #  IaC : manifestes Kubernetes et Compose
  # ──────────────────────────────────────────────────────────
  iac:
    name: IaC — Helm & Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.17.3 }
      - name: Helm lint (strict)
        run: helm lint deploy/helm/fintrack --strict --set config.supabaseUrl=https://ci.supabase.co --set secrets.supabaseAnonKey=ci
      - name: Rendu Helm (défaut, local, production)
        run: |
          set -euo pipefail
          common=(--set config.supabaseUrl=https://ci.supabase.co --set secrets.supabaseAnonKey=ci)
          helm template fintrack deploy/helm/fintrack -n fintrack "${common[@]}" > rendered-default.yaml
          for env in local production; do
            helm template fintrack deploy/helm/fintrack -n fintrack -f "deploy/helm/fintrack/values-${env}.yaml" "${common[@]}" > "rendered-${env}.yaml"
          done
          mkdir -p rendered && mv rendered-*.yaml rendered/
      - name: kubeconform (schémas Kubernetes, mode strict)
        run: |
          curl -sSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xzf kc.tgz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered/*.yaml
      - name: Trivy — mauvaises configurations (manifestes rendus, Compose, Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: deploy/helm   # le chart est analysé via ses manifestes rendus (rendered/)
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        if: always()
        with: { sarif_file: trivy-config.sarif, category: trivy-config }
      - name: Trivy — échec sur CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: deploy/helm   # le chart est analysé via ses manifestes rendus (rendered/)
          exit-code: "1"
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
      - name: docker compose config (validation)
        run: |
          mkdir -p deploy/compose/secrets
          for s in supabase_anon_key session_encryption_key notifier_internal_token notifier_encryption_key \
                   redis_password redis_url anthropic_api_key gemini_api_key ticktick_client_secret; do
            echo x > deploy/compose/secrets/$s; done
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/compose.yaml config -q

  # ──────────────────────────────────────────────────────────
  #  Build de l'exécutable desktop (PR vers main)
  # ──────────────────────────────────────────────────────────
  desktop-build:
    name: Build desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: desktop/requirements.txt }
      - run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller reportlab
      - working-directory: desktop
        run: pyinstaller fintrack.spec
      - run: if (-not (Test-Path "desktop\dist\Fintrack\Fintrack.exe")) { exit 1 }
