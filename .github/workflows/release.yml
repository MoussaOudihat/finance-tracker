name: Release

# Déclenché quand on pousse un tag vX.Y.Z (ex: v3.1.0)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # Nécessaire pour créer la GitHub Release

jobs:
  # ──────────────────────────────────────────────────────────
  #  Build Windows + Publication GitHub Release
  # ──────────────────────────────────────────────────────────
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller reportlab

      - name: Build executable with PyInstaller
        run: |
          pyinstaller "Finance Tracker.spec"
          echo "Build terminé."

      - name: Verify build output
        run: |
          if (Test-Path "dist\Finance Tracker\Finance Tracker.exe") {
            $size = (Get-Item "dist\Finance Tracker\Finance Tracker.exe").Length / 1MB
            Write-Host "✅ Finance Tracker.exe — $([math]::Round($size, 1)) MB"
          } else {
            Write-Host "❌ Exe non trouvé"
            exit 1
          }

      - name: Create ZIP archive
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "FinanceTracker-$version-windows.zip"
          Compress-Archive -Path "dist\Finance Tracker" -DestinationPath $zipName
          Write-Host "✅ Archive créée : $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: python
        run: |
          import re, os

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")   # "3.1.0"

          try:
              with open("CHANGELOG.md", encoding="utf-8") as f:
                  content = f.read()

              # Cherche la section correspondant à la version
              pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else "Voir CHANGELOG.md pour les détails."
          except Exception:
              notes = "Voir CHANGELOG.md pour les détails."

          # Écrire dans GITHUB_OUTPUT (multiline)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("notes<<EOF\n")
              out.write(notes + "\n")
              out.write("EOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Finance Tracker ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 💰 Finance Tracker ${{ github.ref_name }}

            Application desktop Windows de suivi financier personnel — locale, open source, sans cloud.

            ### 📦 Installation

            1. Téléchargez **`${{ env.ZIP_NAME }}`** ci-dessous
            2. Décompressez le dossier
            3. Lancez **`Finance Tracker.exe`**
            4. Créez votre mot de passe au premier lancement

            > ⚠️ Windows peut afficher "Application inconnue" — cliquez *Informations complémentaires* → *Exécuter quand même*

            ### 📋 Changements

            ${{ steps.changelog.outputs.notes }}

            ---
            [Voir le CHANGELOG complet](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
