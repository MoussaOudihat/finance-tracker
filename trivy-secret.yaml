# Configuration du scanner de secrets Trivy (lue par défaut depuis la racine).
# Exceptions VOLONTAIREMENT étroites : une règle, un chemin, une justification.
allow-rules:
  # Faux positif : docstrings du SDK officiel Anthropic (« managed agents »)
  # décrivant un principal GCP — sources et .pyc compilés. Aucune clé réelle.
  # Limité au paquet anthropic installé dans le venv : le scan de secrets
  # reste actif partout ailleurs, y compris sur notre propre code.
  - id: anthropic-sdk-docstring-gcp
    description: Exemple de principal GCP dans la documentation du SDK anthropic
    path: ^/?opt/venv/lib/python3\.\d+/site-packages/anthropic/
